name: Build Android app

# Runs every time you upload changes, or when you press "Run workflow" on the Actions tab.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# The project lives in the adulting-calculator-app folder.
defaults:
  run:
    working-directory: adulting-calculator-app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Make the app icon and splash screen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1F5A41' --splashBackgroundColor '#1F5A41' --splashBackgroundColorDark '#101814'

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../The-Adulting-Calculator.apk

      - name: Save the app file
        uses: actions/upload-artifact@v4
        with:
          name: The-Adulting-Calculator-Android
          path: adulting-calculator-app/The-Adulting-Calculator.apk

      - name: Post a download link on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest The-Adulting-Calculator.apk \
            --title "The Adulting Calculator for Android (latest)" \
            --notes "Open this page on your Android phone and tap The-Adulting-Calculator.apk to download and install it." \
            --target "$GITHUB_SHA"
